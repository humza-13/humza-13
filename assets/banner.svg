<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Muhammad Humza Butt — Technical Product &amp; Systems Architect</title>
  <desc id="d">Difficult systems. Clear decisions. Production delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2F40"/>
      <stop offset="1" stop-color="#123F52"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#467886" stop-opacity="0"/>
      <stop offset="1" stop-color="#7FB3C0" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>

  <!-- restrained system-diagram motif, right side -->
  <g fill="none" stroke="#467886" stroke-width="1.5" opacity="0.75">
    <path d="M760 70 H860 V160 H960 V90 H1060"/>
    <path d="M860 160 V250 H980"/>
    <path d="M960 160 H1060 V240"/>
  </g>
  <g fill="#0A2F40" stroke="#7FB3C0" stroke-width="2">
    <rect x="740" y="55" width="40" height="30" rx="6"/>
    <rect x="840" y="145" width="40" height="30" rx="6"/>
    <rect x="940" y="75" width="40" height="30" rx="6"/>
    <rect x="1040" y="75" width="40" height="30" rx="6"/>
    <rect x="960" y="235" width="40" height="30" rx="6"/>
    <rect x="1040" y="225" width="40" height="30" rx="6"/>
  </g>
  <g fill="#7FB3C0">
    <circle cx="860" cy="160" r="4"/>
    <circle cx="960" cy="160" r="4"/>
    <circle cx="860" cy="250" r="4"/>
  </g>

  <!-- copy -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#FFFFFF">
    <text x="64" y="118" font-size="46" font-weight="700" letter-spacing="0.5">Muhammad Humza Butt</text>
    <text x="64" y="162" font-size="25" font-weight="500" fill="#CFE6EC">Technical Product &amp; Systems Architect</text>
    <rect x="64" y="184" width="320" height="3" rx="1.5" fill="url(#line)"/>
    <text x="64" y="226" font-size="20" font-style="italic" fill="#FFFFFF" opacity="0.92">Difficult systems. Clear decisions. Production delivery.</text>
    <text x="64" y="274" font-size="16" letter-spacing="1" fill="#9CCBD6">AUDITS  ·  MVP ARCHITECTURE  ·  BACKEND &amp; CLOUD  ·  INTERACTIVE PRODUCTS</text>
